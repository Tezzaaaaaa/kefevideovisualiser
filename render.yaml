services:
  - type: web
    name: story-lyrics-cloud
    runtime: docker
    region: singapore
    plan: starter
    autoDeploy: false
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: LYRIC_VIS_USERNAME
        value: story
      - key: LYRIC_VIS_PASSWORD
        sync: false
      - key: LYRIC_VIS_MAX_UPLOAD_MB
        value: "512"
      - key: LYRIC_VIS_DATA
        value: /app/data
      - key: LYRIC_VIS_WEB
        value: /app/web
    disk:
      name: story-lyrics-data
      mountPath: /app/data
      sizeGB: 5
