services:
  - type: web
    name: story-lyrics-cloud
    runtime: docker
    region: singapore
    plan: free
    autoDeploy: false
    healthCheckPath: /api/v1/health
    envVars:
      - key: LYRIC_VIS_USERNAME
        value: story
      - key: LYRIC_VIS_PASSWORD
        sync: false
      - key: LYRIC_VIS_MAX_UPLOAD_MB
        value: "256"
      - key: LYRIC_VIS_DATA
        value: /tmp/story-lyrics
      - key: LYRIC_VIS_WEB
        value: /app/web
