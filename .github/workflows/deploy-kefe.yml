name: Deploy KEFE

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - typography.css
      - typography.js
      - app.js
      - effects/**
      - export/**
      - fonts/homemade-apple/HomemadeApple-Regular.woff2
      - kefe-logo.svg
      - favicon.svg
      - DESIGN-SYSTEM-CHECKLIST.md
      - .github/workflows/deploy-kefe.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kefe-pages
  cancel-in-progress: true

env:
  FFMPEG_VERSION: 0.12.10
  FFMPEG_UTIL_VERSION: 0.12.2
  FFMPEG_CORE_VERSION: 0.12.10

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate release files
        run: |
          set -euo pipefail
          test -f index.html
          test -d export
          for file in index.js ui.js encoder.js diagnostics.js report.js renderer.js segments.js muxer.js cleanup.js errors.js progress.js; do test -s "export/$file"; done
      - name: Validate export module syntax
        run: |
          set -euo pipefail
          for file in export/*.js; do node --check "$file"; done
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html styles.css typography.css typography.js app.js fonts/homemade-apple/HomemadeApple-Regular.woff2 kefe-logo.svg favicon.svg DESIGN-SYSTEM-CHECKLIST.md _site/
          cp -R effects _site/effects
          cp -R export _site/export
          mkdir -p _site/vendor/ffmpeg _site/vendor/util _site/vendor/core /tmp/kefe-vendor

          ffmpeg_pkg=$(npm pack "@ffmpeg/ffmpeg@${FFMPEG_VERSION}" --pack-destination /tmp/kefe-vendor | tail -n 1)
          test -s "/tmp/kefe-vendor/${ffmpeg_pkg}"
          tar -xzf "/tmp/kefe-vendor/${ffmpeg_pkg}" -C /tmp/kefe-vendor
          npm exec --yes esbuild -- --bundle --format=esm --platform=browser /tmp/kefe-vendor/package/dist/esm/index.js --outfile=_site/vendor/ffmpeg/index.js
          npm exec --yes esbuild -- --bundle --format=esm --platform=browser /tmp/kefe-vendor/package/dist/esm/worker.js --outfile=_site/vendor/ffmpeg/worker.js
          cp /tmp/kefe-vendor/package/dist/esm/const.js /tmp/kefe-vendor/package/dist/esm/errors.js _site/vendor/ffmpeg/
          rm -rf /tmp/kefe-vendor/package "/tmp/kefe-vendor/${ffmpeg_pkg}"

          util_pkg=$(npm pack "@ffmpeg/util@${FFMPEG_UTIL_VERSION}" --pack-destination /tmp/kefe-vendor | tail -n 1)
          test -s "/tmp/kefe-vendor/${util_pkg}"
          tar -xzf "/tmp/kefe-vendor/${util_pkg}" -C /tmp/kefe-vendor
          npm exec --yes esbuild -- --bundle --format=esm --platform=browser /tmp/kefe-vendor/package/dist/esm/index.js --outfile=_site/vendor/util/index.js
          rm -rf /tmp/kefe-vendor/package "/tmp/kefe-vendor/${util_pkg}"

          core_pkg=$(npm pack "@ffmpeg/core@${FFMPEG_CORE_VERSION}" --pack-destination /tmp/kefe-vendor | tail -n 1)
          test -s "/tmp/kefe-vendor/${core_pkg}"
          tar -xzf "/tmp/kefe-vendor/${core_pkg}" -C /tmp/kefe-vendor
          cp /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.js /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.wasm _site/vendor/core/
          rm -rf /tmp/kefe-vendor/package "/tmp/kefe-vendor/${core_pkg}"

          test -s _site/vendor/ffmpeg/index.js
          test -s _site/vendor/ffmpeg/worker.js
          test -s _site/vendor/ffmpeg/const.js
          test -s _site/vendor/ffmpeg/errors.js
          test -s _site/vendor/util/index.js
          test -s _site/vendor/core/ffmpeg-core.js
          test -s _site/vendor/core/ffmpeg-core.wasm
          test -s _site/export/index.js
          test -s _site/export/ui.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
