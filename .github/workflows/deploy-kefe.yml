name: Deploy KEFE

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - typography.css
      - typography.js
      - app.js
      - effects/**
      - HomemadeApple-Regular.woff2
      - kefe-logo.svg
      - favicon.svg
      - DESIGN-SYSTEM-CHECKLIST.md
      - .github/workflows/deploy-kefe.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kefe-pages
  cancel-in-progress: true

env:
  FFMPEG_VERSION: 0.12.10
  FFMPEG_UTIL_VERSION: 0.12.1
  FFMPEG_CORE_VERSION: 0.12.6

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release files
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f typography.css
          test -f typography.js
          test -f app.js
          test -f DESIGN-SYSTEM-CHECKLIST.md
          test -d effects
          test -f effects/core.js
          test -f effects/registry.js
          test -f effects/aurora.js
          test -f effects/eternal-sunshine.js
          test -f effects/brat.js
          test -f effects/typewriter.js
          test -f effects/instagram-lyrics.js
          test -f effects/story-fade.js
          test -f effects/effect-app-fx.js
          test -f HomemadeApple-Regular.woff2
          test -f kefe-logo.svg
          test -f favicon.svg
          grep -q 'data-effect="apple"' index.html
          grep -q 'data-effect="brat"' index.html
          grep -q 'data-effect="eternal"' index.html
          grep -q 'data-effect="aurora"' index.html
          grep -q 'data-effect="typewriter"' index.html
          grep -q 'data-effect="instagram"' index.html
          grep -q 'data-effect="fadeup"' index.html
          ! grep -q 'data-effect="mixedmedia"' index.html
          ! grep -q 'data-effect="starwars"' index.html
          ! grep -q 'data-effect="stroke"' index.html
          grep -q "'mixedmedia'" effects/effect-app-fx.js
          grep -q 'effects/core.js' index.html
          grep -q 'effects/aurora.js' index.html
          grep -q 'effects/eternal-sunshine.js' index.html
          grep -q 'effects/typewriter.js' index.html
          grep -q 'effects/instagram-lyrics.js' index.html
          grep -q 'effects/story-fade.js' index.html
          grep -q 'effects/registry.js' index.html
          grep -q 'effects/effect-app-fx.js' index.html
          ! grep -q 'effects/mixed-media.js' index.html
          grep -q 'HomemadeApple-Regular.woff2' styles.css
          grep -q 'startOfflineExport' app.js
          ! grep -q 'MediaRecorder' app.js
          ! grep -q 'fast-export.js' index.html
          ! grep -q 'archive/' index.html
          ! test -f fast-export.js
          ! test -d archive
          ! test -f effects/apple.js
          ! test -f effects/brat-old.js
          ! test -f effects/starfield.js
          ! test -f effects/pulse.js
          ! test -f effects/aurora-old.js
          ! test -f effects/eternal.js
          ! test -f effects/mixed-media.js
          ! test -f effects/stroke.js
          ! test -f effects/star-wars.js
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html styles.css typography.css typography.js app.js HomemadeApple-Regular.woff2 kefe-logo.svg favicon.svg DESIGN-SYSTEM-CHECKLIST.md _site/
          cp -R effects _site/effects
          mkdir -p _site/vendor/ffmpeg _site/vendor/util _site/vendor/core /tmp/kefe-vendor
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/ffmpeg/-/ffmpeg-${FFMPEG_VERSION}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp -R /tmp/kefe-vendor/package/dist/esm/. _site/vendor/ffmpeg/
          rm -rf /tmp/kefe-vendor/*
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/util/-/util-${FFMPEG_UTIL_VERSION}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp -R /tmp/kefe-vendor/package/dist/esm/. _site/vendor/util/
          rm -rf /tmp/kefe-vendor/*
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/core/-/core-${FFMPEG_CORE_VERSION}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.js /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.wasm _site/vendor/core/
          test -s _site/vendor/ffmpeg/index.js
          test -s _site/vendor/util/index.js
          test -s _site/vendor/core/ffmpeg-core.js
          test -s _site/vendor/core/ffmpeg-core.wasm
          test -s _site/typography.css
          test -s _site/typography.js
          test -s _site/DESIGN-SYSTEM-CHECKLIST.md
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
