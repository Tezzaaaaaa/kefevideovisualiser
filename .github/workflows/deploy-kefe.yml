name: Deploy KEFE

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - HomemadeApple-Regular.woff2
      - kefe-logo.svg
      - kefe-logo-light.svg
      - favicon.svg
      - .github/workflows/deploy-kefe.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kefe-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release files
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f HomemadeApple-Regular.woff2
          test -f kefe-logo.svg
          test -f kefe-logo-light.svg
          test -f favicon.svg
          grep -q 'data-effect="aurora"' index.html
          grep -q 'data-effect="pulse"' index.html
          grep -q 'HomemadeApple-Regular.woff2' styles.css
          grep -q 'startOfflineExport' app.js
          ! grep -q 'MediaRecorder' app.js
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html styles.css app.js HomemadeApple-Regular.woff2 kefe-logo.svg kefe-logo-light.svg favicon.svg _site/
          mkdir -p _site/vendor/ffmpeg _site/vendor/util _site/vendor/core /tmp/kefe-vendor
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/ffmpeg/-/ffmpeg-${FFMPEG_VERSION:-0.12.10}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp -R /tmp/kefe-vendor/package/dist/esm/. _site/vendor/ffmpeg/
          rm -rf /tmp/kefe-vendor/*
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/util/-/util-${FFMPEG_UTIL_VERSION:-0.12.1}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp -R /tmp/kefe-vendor/package/dist/esm/. _site/vendor/util/
          rm -rf /tmp/kefe-vendor/*
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/core/-/core-${FFMPEG_CORE_VERSION:-0.12.6}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.js /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.wasm _site/vendor/core/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
