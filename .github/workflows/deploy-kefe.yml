name: Deploy KEFE

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - typography.css
      - typography.js
      - app.js
      - effects/**
      - export/**
      - fonts/homemade-apple/HomemadeApple-Regular.woff2
      - kefe-logo.svg
      - favicon.svg
      - DESIGN-SYSTEM-CHECKLIST.md
      - .github/workflows/deploy-kefe.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kefe-pages
  cancel-in-progress: true

env:
  FFMPEG_VERSION: 0.12.10
  FFMPEG_UTIL_VERSION: 0.12.10
  FFMPEG_CORE_VERSION: 0.12.10

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release files
        run: |
          set -euo pipefail
          test -f index.html
          test -d export
          for file in index.js ui.js encoder.js diagnostics.js report.js renderer.js segments.js muxer.js cleanup.js errors.js progress.js; do test -s "export/$file"; done
      - name: Validate export module imports
        run: |
          set -euo pipefail
          for file in export/*.js; do
            node --check "$file"
          done
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html styles.css typography.css typography.js app.js fonts/homemade-apple/HomemadeApple-Regular.woff2 kefe-logo.svg favicon.svg DESIGN-SYSTEM-CHECKLIST.md _site/
          cp -R effects _site/effects
          cp -R export _site/export
          mkdir -p _site/vendor/ffmpeg _site/vendor/util _site/vendor/core /tmp/kefe-vendor
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/ffmpeg/-/ffmpeg-${FFMPEG_VERSION}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp -R /tmp/kefe-vendor/package/dist/esm/. _site/vendor/ffmpeg/
          rm -rf /tmp/kefe-vendor/*
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/util/-/util-${FFMPEG_UTIL_VERSION}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp -R /tmp/kefe-vendor/package/dist/esm/. _site/vendor/util/
          rm -rf /tmp/kefe-vendor/*
          curl -fsSL "https://registry.npmjs.org/@ffmpeg/core/-/core-${FFMPEG_CORE_VERSION}.tgz" | tar -xz -C /tmp/kefe-vendor
          cp /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.js /tmp/kefe-vendor/package/dist/esm/ffmpeg-core.wasm _site/vendor/core/
          test -s _site/vendor/ffmpeg/index.js
          test -s _site/vendor/util/index.js
          test -s _site/vendor/core/ffmpeg-core.js
          test -s _site/vendor/core/ffmpeg-core.wasm
          test -s _site/export/index.js
          test -s _site/export/ui.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
