name: Deploy LINA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - HomemadeApple-Regular.woff2
      - .github/workflows/deploy-lina.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lina-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release files
        run: |
          set -euo pipefail
          test -f index.html
          test -f HomemadeApple-Regular.woff2
          grep -q 'data-effect="aurora"' index.html
          grep -q 'data-effect="pulse"' index.html
          grep -q 'HomemadeApple-Regular.woff2' index.html
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html HomemadeApple-Regular.woff2 _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
