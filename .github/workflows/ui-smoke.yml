name: LINA UI Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-smoke:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check unified runtime sources
        run: |
          node --check docs/canonical-runtime.js
          node --check docs/canonical-controls.js
          node --check docs/canonical-ui-lock.js
          node --check docs/canonical-export.js
          node --check docs/canonical-audit.js
          node --check docs/preview-quick-controls.js
          node --check docs/style-effect-selector.js
          node --check docs/runtime-guard.js
          node --check docs/transport-lock.js
          node --check docs/apple-letter-highlight.js
          node --check docs/eternal-sunshine-effect.js
          node --check qa/reset-state-lock.mjs
          node --check qa/sticky-preview.mjs
          node --check qa/setup-layout-current.mjs
          node --check qa/editor-shell-current.mjs
          node --check qa/runtime-ownership.mjs
          node --check qa/current-control-matrix.mjs
          node --check qa/safari-export-current.mjs
          node --check qa/live-pages-current.mjs
          test -s docs/reset.html
          test -s docs/sticky-preview.css
          test ! -e docs/production-controls.js
          test ! -e docs/control-audit.js
          test ! -e docs/control-finish.js
          test ! -e docs/preview-runtime.js
          test ! -e docs/preview-recovery.js
          test ! -e docs/layout-reset-fix.js
          test ! -e docs/visual-polish.js
          test ! -e docs/project-reset-button.js
          grep -q "canonical-runtime.js" docs/app-events.js
          grep -q "canonical-controls.js" docs/app-events.js
          grep -q "canonical-ui-lock.js" docs/app-events.js
          grep -q "canonical-export.js" docs/app-events.js
          grep -q "canonical-audit.js" docs/app-events.js
          grep -q "sticky-preview.css" docs/app-events.js
          grep -q "resetProjectVisible" docs/preview-quick-controls.js
          grep -q "reset.html?v=p72" docs/preview-quick-controls.js
          ! grep -q "quickResetLayout" docs/preview-quick-controls.js
          ! grep -q "project-reset-button.js" docs/app-events.js
          ! grep -q "production-controls.js" docs/app-events.js
          ! grep -q "control-audit.js" docs/app-events.js
          ! grep -q "control-finish.js" docs/app-events.js
          ! grep -q "preview-runtime.js" docs/app-events.js
          ! grep -q "preview-recovery.js" docs/app-events.js
          ! grep -q "layout-reset-fix.js" docs/app-events.js
          ! grep -q "visual-polish.js" docs/app-events.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium firefox webkit
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Start LINA
        run: |
          python3 -m http.server 4173 --directory docs >/tmp/lina-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lina-http.log
          exit 1
      - name: Lock destructive project reset with real saved audio
        run: node qa/reset-state-lock.mjs
      - name: Lock sticky Preview across browsers
        run: node qa/sticky-preview.mjs
      - name: Lock current Setup layout across browsers and viewports
        run: node qa/setup-layout-current.mjs
      - name: Lock current editor shell across browsers and viewports
        run: node qa/editor-shell-current.mjs
      - name: Lock canonical runtime ownership across browsers
        run: node qa/runtime-ownership.mjs
      - name: Run unified visible-control matrix across browsers
        run: node qa/current-control-matrix.mjs
      - name: Probe current WebKit FFmpeg export
        run: node qa/safari-export-current.mjs
      - name: Verify the actual published GitHub Pages build
        run: node qa/live-pages-current.mjs