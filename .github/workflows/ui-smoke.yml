name: LINA UI Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-smoke:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check canonical runtime sources
        run: |
          node --check docs/canonical-runtime.js
          node --check docs/preview-quick-controls.js
          node --check docs/style-effect-selector.js
          node --check docs/runtime-guard.js
          node --check docs/transport-lock.js
          node --check docs/apple-letter-highlight.js
          node --check docs/eternal-sunshine-effect.js
          node --check qa/runtime-ownership.mjs
          test ! -e docs/preview-runtime.js
          test ! -e docs/preview-recovery.js
          test ! -e docs/layout-reset-fix.js
          test ! -e docs/visual-polish.js
          grep -q "canonical-runtime.js" docs/app-events.js
          ! grep -q "preview-runtime.js" docs/app-events.js
          ! grep -q "preview-recovery.js" docs/app-events.js
          ! grep -q "layout-reset-fix.js" docs/app-events.js
          ! grep -q "visual-polish.js" docs/app-events.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium firefox webkit
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Start LINA
        run: |
          python3 -m http.server 4173 --directory docs >/tmp/lina-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lina-http.log
          exit 1
      - name: Lock destructive project reset and cleared song details
        run: node qa/reset-state-lock.mjs
      - name: Lock Setup layout across browsers and viewports
        run: node qa/setup-layout-lock.mjs
      - name: Lock adaptive editor shell across browsers and viewports
        run: node qa/editor-shell-layout-lock.mjs
      - name: Lock canonical runtime ownership across browsers
        run: node qa/runtime-ownership.mjs
      - name: Probe WebKit FFmpeg export
        run: node qa/safari-export-probe.mjs
      - name: Run full LINA control and FFmpeg export matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/ui-smoke.mjs')
          s=p.read_text()
          s=s.replace("page.waitForEvent('download',{timeout:15000})", "page.waitForEvent('download',{timeout:90000})")
          s=s.replace("await page.click('#nextStep')", "await page.locator('#nextStep').evaluate(el=>el.click())")
          s=s.replace("await page.click('#prevStep')", "await page.locator('#prevStep').evaluate(el=>el.click())")
          s=s.replace("#exportBottomBtn", "#exportBtn")
          s=s.replace("  await page.locator('#wordEditor .emph').first().fill('1.6');", "  await page.locator('.inspector-disclosure').evaluate(el=>el.open=true);\n  await page.locator('#wordEditor .emph').first().fill('1.6');")
          for line in [
            "  await page.setInputFiles('#userArtworkFile',{name:'art.svg',mimeType:'image/svg+xml',buffer:svg});\n",
            "  await page.waitForFunction(()=>document.querySelector('#userArtworkPreview')?.classList.contains('on'));\n",
            "  assert.equal(await page.isChecked('#userArtworkIntro'),true,`${name}: artwork intro default failed`);\n",
            "  await page.uncheck('#userArtworkIntro');assert.equal(await page.isChecked('#showArtworkIntro'),false,`${name}: intro artwork toggle failed`);\n",
            "  await page.check('#userArtworkIntro');\n",
          ]:
            s=s.replace(line,'')
          p.write_text(s)
          PY
          node qa/ui-smoke.mjs
