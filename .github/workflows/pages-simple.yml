name: Deploy Story Lyrics Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-simple.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate LINA runtime
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/index.html
            docs/style.css
            docs/app-events.js
            docs/app-core-safe.js
            docs/app-media-safe.js
            docs/app-export-safe.js
            docs/app-events-safe.js
            docs/media-lifecycle.js
            docs/apple-timing.js
            docs/apple-motion.js
            docs/apple-subword.js
            docs/preview-runtime.js
            docs/apple-motion.css
            docs/ui-solid.css
            docs/panel-nav.js
            docs/intro-layout.js
            docs/intro-layout.css
            docs/runtime-guard.js
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing required runtime file: $f"; exit 1; }
          done
          for f in docs/*.js; do
            echo "Syntax checking $f"
            node --check "$f"
          done
          grep -q 'app-events.js' docs/index.html || { echo 'index.html does not load the LINA bootstrap'; exit 1; }
          grep -q 'app-core-safe.js' docs/app-events.js || { echo 'bootstrap does not load canonical core'; exit 1; }
          grep -q 'app-media-safe.js' docs/app-events.js || { echo 'bootstrap does not load canonical media'; exit 1; }
          grep -q 'app-export-safe.js' docs/app-events.js || { echo 'bootstrap does not load export runtime'; exit 1; }
          grep -q 'media-lifecycle.js' docs/app-events.js || { echo 'bootstrap does not load media lifecycle layer'; exit 1; }
          grep -q 'apple-timing.js' docs/app-events.js || { echo 'bootstrap does not load timing repair layer'; exit 1; }
          grep -q 'apple-motion.js' docs/app-events.js || { echo 'bootstrap does not load Apple motion engine'; exit 1; }
          grep -q 'apple-subword.js' docs/app-events.js || { echo 'bootstrap does not load sub-word motion layer'; exit 1; }
          grep -q 'preview-runtime.js' docs/app-events.js || { echo 'bootstrap does not load hardened preview runtime'; exit 1; }
          grep -q 'panel-nav.js' docs/app-events.js || { echo 'bootstrap does not load stable panel navigation'; exit 1; }
          grep -q 'intro-layout.js' docs/app-events.js || { echo 'bootstrap does not load adaptive intro layout'; exit 1; }
          grep -q 'intro-layout.css' docs/app-events.js || { echo 'bootstrap does not load adaptive intro styling'; exit 1; }
          grep -q 'runtime-guard.js' docs/app-events.js || { echo 'bootstrap does not load runtime guard'; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
