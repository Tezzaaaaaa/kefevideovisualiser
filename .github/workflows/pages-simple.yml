name: Deploy Story Lyrics Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-simple.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate LINA canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/index.html
            docs/reset.html
            docs/app-source.html
            docs/style.css
            docs/app-events.js
            docs/app-core-safe.js
            docs/app-media-safe.js
            docs/app-events-safe.js
            docs/ffmpeg-export.js
            docs/media-lifecycle.js
            docs/apple-timing.js
            docs/apple-motion.js
            docs/apple-subword.js
            docs/apple-motion.css
            docs/ui-solid.css
            docs/setup-shell.js
            docs/setup-shell.css
            docs/intro-layout.js
            docs/intro-layout.css
            docs/preview-quick-controls.js
            docs/preview-quick-controls.css
            docs/sticky-preview.css
            docs/canonical-runtime.js
            docs/canonical-controls.js
            docs/canonical-ui-lock.js
            docs/canonical-export.js
            docs/canonical-audit.js
            docs/project-state-fix.js
            docs/style-effect-selector.js
            docs/transport-lock.js
            docs/apple-letter-highlight.js
            docs/eternal-sunshine-effect.js
            docs/runtime-guard.js
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing required runtime file: $f"; exit 1; }
          done

          retired=(
            docs/preview-runtime.js
            docs/preview-recovery.js
            docs/layout-reset-fix.js
            docs/production-controls.js
            docs/control-audit.js
            docs/control-finish.js
            docs/visual-polish.js
            docs/fresh-reset.js
            docs/reset-button-v2.js
            docs/project-reset-button.js
          )
          for f in "${retired[@]}"; do
            test ! -e "$f" || { echo "Retired controller unexpectedly present: $f"; exit 1; }
          done

          for f in docs/*.js; do
            echo "Syntax checking $f"
            node --check "$f"
          done

          grep -q 'app-events.js' docs/index.html || { echo 'index.html does not load the LINA bootstrap'; exit 1; }
          grep -q 'reset.html' docs/index.html || { echo 'index.html does not preserve legacy reset routing'; exit 1; }
          grep -q 'reset.html?v=p72' docs/preview-quick-controls.js || { echo 'Quick Settings does not expose the standalone project reset'; exit 1; }
          grep -q 'sticky-preview.css' docs/app-events.js || { echo 'bootstrap does not load sticky preview'; exit 1; }
          grep -q 'app-core-safe.js' docs/app-events.js || { echo 'bootstrap does not load canonical core'; exit 1; }
          grep -q 'app-media-safe.js' docs/app-events.js || { echo 'bootstrap does not load canonical media'; exit 1; }
          grep -q 'ffmpeg-export.js' docs/app-events.js || { echo 'bootstrap does not load export runtime'; exit 1; }
          grep -q 'media-lifecycle.js' docs/app-events.js || { echo 'bootstrap does not load media lifecycle layer'; exit 1; }
          grep -q 'apple-timing.js' docs/app-events.js || { echo 'bootstrap does not load timing layer'; exit 1; }
          grep -q 'apple-motion.js' docs/app-events.js || { echo 'bootstrap does not load Apple motion engine'; exit 1; }
          grep -q 'apple-subword.js' docs/app-events.js || { echo 'bootstrap does not load sub-word motion layer'; exit 1; }
          grep -q 'setup-shell.js' docs/app-events.js || { echo 'bootstrap does not load rebuilt setup shell'; exit 1; }
          grep -q 'preview-quick-controls.js' docs/app-events.js || { echo 'bootstrap does not load Quick Settings'; exit 1; }
          grep -q 'canonical-runtime.js' docs/app-events.js || { echo 'bootstrap does not load canonical runtime'; exit 1; }
          grep -q 'canonical-controls.js' docs/app-events.js || { echo 'bootstrap does not load canonical controls'; exit 1; }
          grep -q 'canonical-ui-lock.js' docs/app-events.js || { echo 'bootstrap does not load canonical UI lock'; exit 1; }
          grep -q 'canonical-export.js' docs/app-events.js || { echo 'bootstrap does not load canonical export'; exit 1; }
          grep -q 'canonical-audit.js' docs/app-events.js || { echo 'bootstrap does not load canonical audit'; exit 1; }
          grep -q 'transport-lock.js' docs/app-events.js || { echo 'bootstrap does not load canonical transport'; exit 1; }
          grep -q 'runtime-guard.js' docs/app-events.js || { echo 'bootstrap does not load runtime guard'; exit 1; }

          ! grep -q 'project-reset-button.js' docs/app-events.js || { echo 'bootstrap still references retired reset controller'; exit 1; }
          ! grep -q 'quickResetLayout' docs/preview-quick-controls.js || { echo 'Quick Settings still contains the retired lyric-layout reset'; exit 1; }
          ! grep -q 'preview-runtime.js' docs/app-events.js || { echo 'bootstrap still references retired preview-runtime'; exit 1; }
          ! grep -q 'preview-recovery.js' docs/app-events.js || { echo 'bootstrap still references retired preview-recovery'; exit 1; }
          ! grep -q 'layout-reset-fix.js' docs/app-events.js || { echo 'bootstrap still references retired layout reset controller'; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
