name: Deploy Story Lyrics Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-simple.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply export-duration fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          old_duration = "$('#duration').onchange=e=>{duration=+e.target.value};"
          new_duration = "$('#duration').onchange=e=>{duration=Math.max(1,Number(e.target.value)||15);$('#status').textContent=`Export length set to ${duration} seconds`};"

          old_export = "const start=performance.now(),seconds=Math.min(duration,audio.duration||duration);"
          new_export = "const selectedSeconds=Math.max(1,Number($('#duration').value)||15),start=performance.now(),seconds=Math.min(selectedSeconds,audio.duration||selectedSeconds);$('#renderText').textContent=`Preparing ${Math.round(seconds)} second export`;"

          old_filename = "file=new File([blob],`story-lyrics.${ext}`,{type:blob.type});"
          new_filename = "file=new File([blob],`story-lyrics-${Math.round(seconds)}s.${ext}`,{type:blob.type});"

          replacements = [
              (old_duration, new_duration),
              (old_export, new_export),
              (old_filename, new_filename),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected export code not found: {old[:60]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
