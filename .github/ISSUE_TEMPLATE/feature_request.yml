name: Feature request
description: Propose a focused improvement to LINA.
title: "[IDEA] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## LINA / FEATURE REQUEST
        The best ideas make the workflow clearer, smoother, more adaptive, or more reliable without bloating the interface.
  - type: textarea
    id: idea
    attributes:
      label: What should LINA do?
      placeholder: Describe the feature in one clear idea.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why does it improve the workflow?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lyrics / LRC
        - Apple Music workflow
        - Karaoke / motion
        - Timing / sync
        - Typography
        - Composition
        - Export / metadata
        - Reliability / recovery
        - Interface / navigation
        - Other
  - type: textarea
    id: simplicity
    attributes:
      label: Can this stay minimal?
      description: Explain how it can fit the Helvetica-first, single-workspace design without creating duplicate setup or unnecessary controls.
