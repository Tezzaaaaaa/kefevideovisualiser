<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>LINA: Lyric Video Visualizer</title>
</head>
<body>
<script>
(async()=>{
  const BUILD='p70-20260812-reset-clears-media-store';
  const MEDIA_DB='lina-project-media';
  const MEDIA_STORE='files';

  function clearLinaStorage(){
    try{
      for(let i=localStorage.length-1;i>=0;i--){
        const key=localStorage.key(i);
        if(key&&(key==='lina.project.v2'||key.startsWith('lina.')))localStorage.removeItem(key);
      }
    }catch{}
    try{
      for(let i=sessionStorage.length-1;i>=0;i--){
        const key=sessionStorage.key(i);
        if(key&&key.startsWith('lina.'))sessionStorage.removeItem(key);
      }
    }catch{}
  }

  function clearSavedMediaStore(){
    if(!('indexedDB' in window))return Promise.resolve();
    return new Promise((resolve,reject)=>{
      let request;
      try{request=indexedDB.open(MEDIA_DB,1)}catch(error){reject(error);return}
      request.onupgradeneeded=()=>{
        const db=request.result;
        if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE);
      };
      request.onerror=()=>reject(request.error||new Error('Unable to open LINA media storage'));
      request.onsuccess=()=>{
        const db=request.result;
        try{
          const tx=db.transaction(MEDIA_STORE,'readwrite');
          tx.objectStore(MEDIA_STORE).clear();
          tx.oncomplete=()=>{db.close();resolve()};
          tx.onerror=()=>{const error=tx.error;db.close();reject(error||new Error('Unable to clear LINA media storage'))};
          tx.onabort=()=>{const error=tx.error;db.close();reject(error||new Error('LINA media reset aborted'))};
        }catch(error){db.close();reject(error)}
      };
    });
  }

  async function resetBeforeBoot(){
    const params=new URLSearchParams(location.search);
    if(params.get('reset')!=='1')return;

    document.body.innerHTML='<main style="font-family:system-ui;background:#0a0a0b;color:#fff;min-height:100vh;padding:24px"><h1>LINA</h1><p>Resetting project…</p></main>';
    clearLinaStorage();
    await clearSavedMediaStore();
    clearLinaStorage();
    try{history.replaceState(null,'',location.pathname)}catch{}
  }

  try{
    await resetBeforeBoot();
    const response=await fetch(`app-source.html?v=${BUILD}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    html=html
      .replace('style.css','style.css?v='+BUILD)
      .replace('app-core.js','app-core.js?v='+BUILD)
      .replace('app-media.js','app-media.js?v='+BUILD)
      .replace('app-events.js?v=20260811a','app-events.js?v='+BUILD);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;background:#0a0a0b;color:#fff;min-height:100vh;padding:24px"><h1>LINA</h1><p>Reset failed before the editor restarted. Reload and press Reset project again.</p></main>';
    console.error('LINA entry/reset failed',error);
  }
})();
</script>
</body>
</html>
