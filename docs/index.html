<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>LINA: Lyric Video Visualizer</title>
</head>
<body>
<script>
(async()=>{
  const BUILD='p27-20260811-entry-cache-reset';
  try{
    const response=await fetch(`app-source.html?v=${BUILD}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    html=html
      .replace('style.css','style.css?v='+BUILD)
      .replace('app-core.js','app-core.js?v='+BUILD)
      .replace('app-media.js','app-media.js?v='+BUILD)
      .replace('app-events.js?v=20260811a','app-events.js?v='+BUILD);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;background:#0a0a0b;color:#fff;min-height:100vh;padding:24px"><h1>LINA</h1><p>Failed to load the editor. Reload once.</p></main>';
    console.error('LINA entry load failed',error);
  }
})();
</script>
</body>
</html>
