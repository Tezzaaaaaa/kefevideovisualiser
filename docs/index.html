<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>LINA: Lyric Video Visualizer</title>
</head>
<body>
<script>
(async()=>{
  const BUILD='p92-20260812-consolidated-runtime';

  const params=new URLSearchParams(location.search);
  if(params.get('reset')==='1'){
    location.replace(`reset.html?v=${BUILD}&nonce=${Date.now()}`);
    return;
  }

  if(params.get('freshReset')==='1'){
    const linaKey=key=>/^lina(?:[.:-]|$)/i.test(String(key||''));
    for(const storage of [localStorage,sessionStorage]){
      try{for(let i=storage.length-1;i>=0;i--){const key=storage.key(i);if(linaKey(key))storage.removeItem(key)}}catch{}
    }
    const deleteDb=name=>new Promise(resolve=>{
      if(!('indexedDB'in window)){resolve();return}
      let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};const timer=setTimeout(finish,1800);
      try{const req=indexedDB.deleteDatabase(name);req.onsuccess=finish;req.onerror=finish;req.onblocked=()=>setTimeout(finish,900)}catch{finish()}
    });
    const databases=new Set(['lina-project-media']);
    if(typeof indexedDB?.databases==='function')try{for(const info of await indexedDB.databases())if(info?.name&&/lina|lyric.?video|story.?lyrics/i.test(info.name))databases.add(info.name)}catch{}
    const cleanCaches=async()=>{if(!('caches'in window))return;for(const name of await caches.keys()){const cache=await caches.open(name);for(const request of await cache.keys())try{if(new URL(request.url).pathname.includes('/lyricvideovisualiser/'))await cache.delete(request)}catch{}}};
    await Promise.all([[...databases].map(deleteDb),cleanCaches()].flat());
    window.LINA_FRESH_RESET=true;
  }

  try{
    const response=await fetch(`app-source.html?v=${BUILD}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    html=html
      .replace('style.css','style.css?v='+BUILD)
      .replace('app-core.js','app-core.js?v='+BUILD)
      .replace('app-media.js','app-media.js?v='+BUILD)
      .replace('app-events.js?v=20260811a','app-events.js?v='+BUILD);
    html=html.replace('</head>','<style id="lina-boot-style">html{background:#0a0a0b}body{visibility:hidden}</style></head>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;background:#0a0a0b;color:#fff;min-height:100vh;padding:24px"><h1>LINA</h1><p>Failed to load the editor. Reload once.</p></main>';
    console.error('LINA entry load failed',error);
  }
})();
</script>
</body>
</html>
