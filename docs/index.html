<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Story Lyrics</title><style>
:root{--accent:#fff;--dim:.22}*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font:15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:#09090bee;border-bottom:1px solid #28282d}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#999;font-weight:500;letter-spacing:0;font-size:11px}.done,.pill,.tab,.card,select,input[type=number]{border:1px solid #38383f;background:#1c1c20;color:#fff;border-radius:14px;padding:11px 13px}.done{background:#fff;color:#000;font-weight:800}.layout{display:grid;grid-template-columns:minmax(280px,430px) minmax(300px,1fr);gap:18px;max-width:1100px;margin:auto;padding:18px}.story{position:relative;aspect-ratio:9/16;max-height:72vh;margin:auto;overflow:hidden;border-radius:26px;background:#17171b;box-shadow:0 20px 60px #0008}.bg{position:absolute;inset:-20px;background:linear-gradient(155deg,#512da8,#e91e63 55%,#ff9800);background-size:cover;background-position:center}.bg video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}.lyrics{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);text-align:center;font-weight:900;font-size:clamp(30px,7vw,58px);line-height:1.02;text-shadow:0 3px 18px #000b;touch-action:none}.lyrics .muted{opacity:.35;font-size:.58em;display:block;margin:.55em}.lyrics .current{color:var(--accent)}.karaoke{background:linear-gradient(90deg,var(--accent) var(--p),#ffffff55 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}.word{display:inline-block;animation:pop .25s both}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.8)}to{opacity:1;transform:none}}.music{position:absolute;left:5%;bottom:4%;background:#0008;border-radius:999px;padding:9px 14px;font-size:12px}.transport{display:flex;gap:10px;align-items:center;margin:12px 0}.transport input{flex:1}.controls{display:grid;gap:12px}.tabs{display:flex;gap:8px;overflow:auto}.tab.active{background:#fff;color:#000}.panel{display:none}.panel.active{display:grid;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card label{display:grid;gap:7px;color:#bbb}.upload{display:block;text-align:center}.upload input{display:none}.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.effects button.active{background:#fff;color:#000}.timeline{max-height:230px;overflow:auto;display:grid;gap:6px}.line{display:grid;grid-template-columns:70px 1fr;text-align:left}.line.active{border-color:#fff}.status{min-height:22px;color:#bbb}.hidden{display:none!important}dialog{background:#17171b;color:#fff;border:1px solid #444;border-radius:20px;width:min(92vw,420px)}dialog::backdrop{background:#000b}progress{width:100%}@media(max-width:760px){.layout{display:block;padding:12px}.story{max-height:none;width:min(100%,390px)}.controls{margin-top:14px}.grid{grid-template-columns:1fr 1fr}header{padding-left:12px;padding-right:12px}.brand small{display:none}}
</style></head><body><header><div class="brand">STORY LYRICS<small>client-side iPhone edition</small></div><button id="export" class="done">Export</button></header><main class="layout"><section><div class="story" id="story"><div class="bg" id="bg"></div><div class="shade"></div><div class="lyrics" id="lyrics">Add lyrics to begin</div><div class="music">♫ <span id="song">Original audio</span></div></div><div class="transport"><button id="play" class="pill">▶</button><input id="seek" type="range" min="0" max="15" step=".01" value="0"><span id="clock">0:00</span></div></section><section class="controls"><div class="tabs"><button class="tab active" data-tab="create">Create</button><button class="tab" data-tab="style">Style</button><button class="tab" data-tab="timing">Timing</button><button class="tab" data-tab="project">Project</button></div><div class="panel active" data-panel="create"><div class="grid"><label class="upload pill">♫ Add audio<input id="audioFile" type="file" accept="audio/*"></label><label class="upload pill">Aa Add lyrics<input id="lyricsFile" type="file" accept=".txt,.lrc,.srt,text/plain"></label><label class="upload pill">▣ Background<input id="bgFile" type="file" accept="image/*,video/*"></label><button id="colour" class="pill">Colour</button></div><div class="status" id="status">Everything stays on this device.</div></div><div class="panel" data-panel="style"><div class="effects" id="effects"></div><div class="card grid"><label>Size<input id="size" type="range" min="28" max="82" value="54"></label><label>Position<input id="position" type="range" min="18" max="82" value="50"></label><label>Align<select id="align"><option>center</option><option>left</option><option>right</option></select></label><label>Dim<input id="dim" type="range" min="0" max="70" value="22"></label></div></div><div class="panel" data-panel="timing"><div class="card"><label>Global lyric offset <span id="offsetText">0 ms</span><input id="offset" type="range" min="-5000" max="5000" step="50" value="0"></label></div><div class="timeline" id="timeline"></div></div><div class="panel" data-panel="project"><div class="card grid"><label>Story length<select id="duration"><option>15</option><option>30</option><option>45</option><option>60</option></select></label><label>Export quality<select id="quality"><option value="720">720 × 1280</option><option value="1080">1080 × 1920</option></select></label></div><p class="status">Safari records MP4 where supported. Other browsers may save WebM. Keep this page open during export.</p></div></section></main><audio id="audio"></audio><canvas id="canvas" class="hidden"></canvas><dialog id="dlg"><h3>Rendering on this iPhone</h3><p id="renderText">Preparing…</p><progress id="progress" max="100" value="0"></progress><p><button id="cancel" class="pill">Cancel</button></p></dialog><script>
const $=s=>document.querySelector(s),audio=$('#audio'),lyrics=$('#lyrics'),story=$('#story'),bg=$('#bg');let lines=[],effect='stack',accent='#fff',offset=0,duration=15,bgMedia=null,bgURL=null,audioFile=null,abort=false;const modes=[['stack','Stack'],['karaoke','Karaoke'],['type','Type'],['poster','Poster'],['words','Words'],['classic','Classic']];$('#effects').innerHTML=modes.map((x,i)=>`<button class="pill ${i?'':'active'}" data-effect="${x[0]}">${x[1]}</button>`).join('');
function tc(v){const p=v.trim().replace(',','.').split(':').map(Number);return Math.round((p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1])*1000)}function parse(text,name){if(name.toLowerCase().endsWith('.srt')){return text.replace(/\r/g,'').trim().split(/\n\s*\n/).flatMap(b=>{const r=b.split('\n'),i=r.findIndex(x=>x.includes('-->'));if(i<0)return[];const [a,z]=r[i].split('-->').map(tc),copy=r.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim();return copy?[{text:copy,start:a,duration:z-a}]:[]})}if(name.toLowerCase().endsWith('.lrc')){const out=[];for(const row of text.replace(/\r/g,'').split('\n')){const tags=[...row.matchAll(/\[(\d+:\d+(?:[.:]\d+)?)\]/g)],copy=row.replace(/\[[^\]]+\]/g,'').replace(/<[^>]+>/g,'').trim();for(const t of tags)if(copy)out.push({text:copy,start:tc(t[1].replace('.',':')),duration:2600})}out.sort((a,b)=>a.start-b.start);out.forEach((x,i)=>x.duration=Math.max(100,(out[i+1]?.start||x.start+2600)-x.start));return out}return text.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).map((text,i)=>({text,start:i*2600,duration:2600}))}
function current(ms){let i=0;for(let n=0;n<lines.length;n++){if(lines[n].start+offset<=ms)i=n;else break}return i}function esc(v){return v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(ms){if(!lines.length)return;const i=current(ms),l=lines[i],p=Math.max(0,Math.min(1,(ms-(l.start+offset))/Math.max(100,l.duration)));document.querySelectorAll('.line').forEach((x,n)=>x.classList.toggle('active',n===i));if(effect==='stack')lyrics.innerHTML=[lines[i-1]&&`<span class="muted">${esc(lines[i-1].text)}</span>`,`<span class="current">${esc(l.text)}</span>`,lines[i+1]&&`<span class="muted">${esc(lines[i+1].text)}</span>`].filter(Boolean).join('');else if(effect==='karaoke')lyrics.innerHTML=`<span class="karaoke" style="--p:${p*100}%">${esc(l.text)}</span>`;else if(effect==='type')lyrics.textContent=l.text.slice(0,Math.ceil(l.text.length*p));else if(effect==='poster')lyrics.innerHTML=`<span class="current" style="font-size:1.25em">${esc(l.text)}</span>`;else if(effect==='words'){const w=l.text.split(/\s+/),n=Math.ceil(w.length*p);lyrics.innerHTML=w.slice(0,n).map(x=>`<span class="word">${esc(x)}</span>`).join(' ')}else lyrics.innerHTML=`<span class="current" style="opacity:${Math.min(1,p*5)}">${esc(l.text)}</span>`}
function timeline(){const box=$('#timeline');box.innerHTML=lines.map((l,i)=>`<button class="line pill" data-i="${i}"><span>${(l.start/1000).toFixed(2)}s</span><b>${esc(l.text)}</b></button>`).join('');box.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;audio.currentTime=Math.max(0,(lines[+b.dataset.i].start+offset)/1000)}}
$('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.tab))};$('#effects').onclick=e=>{const b=e.target.closest('[data-effect]');if(!b)return;effect=b.dataset.effect;document.querySelectorAll('#effects button').forEach(x=>x.classList.toggle('active',x===b));render(audio.currentTime*1000)};$('#lyricsFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;lines=parse(await f.text(),f.name);timeline();render(0);$('#status').textContent=`${lines.length} lyric lines loaded`};$('#audioFile').onchange=e=>{audioFile=e.target.files[0];if(!audioFile)return;audio.src=URL.createObjectURL(audioFile);$('#song').textContent=audioFile.name.replace(/\.[^.]+$/,'');audio.onloadedmetadata=()=>{$('#seek').max=Math.min(duration,audio.duration)}};$('#bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(bgURL)URL.revokeObjectURL(bgURL);bgURL=URL.createObjectURL(f);bg.innerHTML='';bg.style.backgroundImage='none';if(f.type.startsWith('video/')){const v=document.createElement('video');v.src=bgURL;v.autoplay=v.loop=v.muted=true;v.playsInline=true;bg.append(v);bgMedia=v}else{bg.style.backgroundImage=`url('${bgURL}')`;bgMedia=null}};$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>{$('#play').textContent='❚❚';tick()};audio.onpause=()=>$('#play').textContent='▶';function tick(){const t=audio.currentTime;$('#seek').value=t;$('#clock').textContent=`0:${String(Math.floor(t)).padStart(2,'0')}`;render(t*1000);if(!audio.paused)requestAnimationFrame(tick)}$('#seek').oninput=e=>{audio.currentTime=+e.target.value;render(audio.currentTime*1000)};$('#size').oninput=e=>lyrics.style.fontSize=e.target.value+'px';$('#position').oninput=e=>lyrics.style.top=e.target.value+'%';$('#align').onchange=e=>lyrics.style.textAlign=e.target.value;$('#dim').oninput=e=>document.documentElement.style.setProperty('--dim',e.target.value/100);$('#offset').oninput=e=>{offset=+e.target.value;$('#offsetText').textContent=`${offset>0?'+':''}${offset} ms`;render(audio.currentTime*1000)};$('#duration').onchange=e=>{duration=+e.target.value;$('#seek').max=Math.min(duration,audio.duration||duration)};$('#colour').onclick=()=>{const c=['#fff','#ffe600','#ff2d8f','#7c5cff','#00e7ff','#5cff8d'];accent=c[(c.indexOf(accent)+1)%c.length];document.documentElement.style.setProperty('--accent',accent)};
function mime(){return ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||''}function drawCover(ctx,m,w,h){const sw=m.videoWidth||m.naturalWidth,sh=m.videoHeight||m.naturalHeight;if(!sw||!sh)return;const s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;ctx.drawImage(m,(w-dw)/2,(h-dh)/2,dw,dh)}async function exportVideo(){if(!audioFile||!lines.length)return alert('Add audio and lyrics first.');if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder)return alert('This Safari version cannot record canvas video.');abort=false;const q=+$('#quality').value,w=q,h=Math.round(q*16/9),c=$('#canvas'),ctx=c.getContext('2d');c.width=w;c.height=h;const stream=c.captureStream(q===1080?24:30),ac=new AudioContext(),src=ac.createMediaElementSource(audio),dest=ac.createMediaStreamDestination();src.connect(dest);src.connect(ac.destination);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const type=mime(),rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:q===1080?7000000:3500000}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const dlg=$('#dlg');dlg.showModal();audio.currentTime=0;await audio.play();rec.start(500);const start=performance.now(),seconds=Math.min(duration,audio.duration||duration);await new Promise(resolve=>{function frame(now){const elapsed=(now-start)/1000;if(abort||elapsed>=seconds){rec.stop();audio.pause();return}ctx.fillStyle='#17171b';ctx.fillRect(0,0,w,h);if(bgMedia?.readyState>=2)drawCover(ctx,bgMedia,w,h);ctx.fillStyle=`rgba(0,0,0,${getComputedStyle(document.documentElement).getPropertyValue('--dim')||.22})`;ctx.fillRect(0,0,w,h);const i=current(elapsed*1000),l=lines[i],p=Math.max(0,Math.min(1,(elapsed*1000-(l.start+offset))/Math.max(100,l.duration)));ctx.textAlign=$('#align').value;ctx.textBaseline='middle';ctx.font=`900 ${+$('#size').value*(w/390)}px -apple-system,Arial`;ctx.fillStyle=accent;ctx.strokeStyle='#0008';ctx.lineWidth=8;const x=ctx.textAlign==='left'?w*.08:ctx.textAlign==='right'?w*.92:w/2,y=h*(+$('#position').value/100);let text=l.text;if(effect==='type')text=text.slice(0,Math.ceil(text.length*p));if(effect==='words')text=text.split(/\s+/).slice(0,Math.ceil(text.split(/\s+/).length*p)).join(' ');const words=text.split(/\s+/),rows=[];let row='';for(const word of words){const t=row?row+' '+word:word;if(ctx.measureText(t).width>w*.82&&row){rows.push(row);row=word}else row=t}if(row)rows.push(row);rows.forEach((r,n)=>{const yy=y+(n-(rows.length-1)/2)*(+$('#size').value*(w/390)*1.05);ctx.strokeText(r,x,yy);ctx.fillText(r,x,yy)});$('#progress').value=elapsed/seconds*100;$('#renderText').textContent=`Rendering ${Math.round(elapsed/seconds*100)}%`;requestAnimationFrame(frame)}rec.onstop=resolve;requestAnimationFrame(frame)});await ac.close();if(abort){dlg.close();return}const blob=new Blob(chunks,{type:type||'video/webm'}),ext=blob.type.includes('mp4')?'mp4':'webm',file=new File([blob],`Story-Lyrics.${ext}`,{type:blob.type});$('#progress').value=100;$('#renderText').textContent=`${ext.toUpperCase()} ready`;try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Story Lyrics'});else throw 0}catch{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}setTimeout(()=>dlg.close(),500)}$('#export').onclick=exportVideo;$('#cancel').onclick=()=>{abort=true;$('#dlg').close()};
</script></body></html>
