<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LINA</title><meta name="description" content="Create a lyric video in five steps."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><main class="lina"><header><div class="brand">LINA <i></i><small>LYRIC VIDEO</small></div><button id="exportBtn" class="primary">Export</button></header>
<section class="flow">
<div class="step"><b>1</b><span>Load audio<small id="audioStatus">Choose an audio file</small></span><input id="audioInput" class="file-input" type="file" accept=".mp3,.m4a,.wav,.aac,.ogg,.flac,audio/*"><label class="file-button" for="audioInput">Choose audio</label></div>
<div class="step"><b>2</b><span>Get lyrics automatically<small id="lyricsStatus">Waiting for audio</small></span><button id="findLyrics" disabled>Find lyrics</button></div>
<div class="step"><b>3</b><span>Load background<small id="backgroundStatus">Choose an image or video</small></span><input id="backgroundInput" class="file-input" type="file" accept="image/*,video/*"><label class="file-button" for="backgroundInput">Choose background</label></div>
<div class="step effects"><b>4</b><span>Choose effect</span><div id="effects"><button data-effect="apple" class="active">Apple Music</button><button data-effect="brat">Brat</button><button data-effect="eternal">Eternal Sunshine</button></div><div class="effect-controls"><div class="control-row"><span class="control-label">Placement</span><div id="alignment" class="segmented"><button data-align="left">Left</button><button data-align="center" class="active">Middle</button><button data-align="right">Right</button></div></div><label class="range-control" for="lyricSize"><span>Lyric size</span><output id="lyricSizeValue" for="lyricSize">76</output><input id="lyricSize" type="range" min="36" max="150" value="76" step="1"></label><div class="haze-controls"><div class="control-row haze-head"><span class="control-label">Haze</span><label class="switch-label"><input id="hazeEnabled" type="checkbox"><span>On</span></label></div><div id="hazePresets" class="segmented haze-presets"><button type="button" data-haze-preset="green">Green</button><button type="button" data-haze-preset="white">White</button><label class="color-pick" title="Custom haze colour"><input id="hazeColor" type="color" value="#8ace00"><span>Custom</span></label></div><label class="range-control" for="hazeOpacity"><span>Transparency</span><output id="hazeOpacityValue" for="hazeOpacity">24%</output><input id="hazeOpacity" type="range" min="0" max="100" value="24" step="1"></label></div></div></div>
<div class="step final"><b>5</b><span>Export<small id="readyStatus">Add audio, lyrics and background</small></span><button id="exportBottom" class="primary">Export video</button></div>
</section>
<section class="preview"><div class="preview-head"><strong>Preview</strong><div id="aspects"><button data-aspect="9:16" class="active">9:16</button><button data-aspect="1:1">1:1</button><button data-aspect="16:9">16:9</button></div></div><canvas id="stageCanvas" width="1080" height="1920"></canvas><div class="transport"><button id="playBtn">▶</button><input id="seek" type="range" min="0" max="0" value="0" step=".01"><time id="clock">0:00 / 0:00</time></div></section>
</main><audio id="audioEl" preload="auto"></audio><video id="backgroundVideo" class="media-source" muted loop playsinline preload="auto"></video><div id="exportOverlay" class="overlay hidden"><div><strong id="exportPct">0%</strong><p id="exportStatus">Rendering…</p><progress id="exportProgress" max="100" value="0"></progress><button id="cancelExport">Cancel</button></div></div><div id="toast" class="toast"></div><script type="module" src="src/main.js"></script></body></html>
